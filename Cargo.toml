[package]
name = "fast-pack"
version = "1.1.11"
authors = ["ColdEternity Team", "Long_Cold", "Wind_"]
description = "Fast Pack: automatic Minecraft Java resource pack version conversion"
license-file = "LICENSE"
repository = "https://github.com/LongCold-ColdEternity-Team/Fast-Pack"
readme = "README.md"
edition = "2024"
default-run = "FastPack"

[lib]
name = "fast_pack"

[[bin]]
name = "FastPack"
path = "src/main.rs"

[[bin]]
name = "fast-pack-cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tempfile = "3.27"
walkdir = "2.5"
zip = { version = "6.0", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.16", default-features = false }
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "thread-pool", "advanced", "canvas", "tokio", "image-without-codecs"] }
png = "0.18"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
sha2 = "=0.10.9"

[profile.release]
lto = true
codegen-units = 1
strip = true

